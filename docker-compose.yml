services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: terrasat
      POSTGRES_PASSWORD: terrasat-local
      POSTGRES_DB: terrasat
    ports: ["5432:5432"]
    volumes: ["terrasat-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrasat"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  terrasat-postgres:

